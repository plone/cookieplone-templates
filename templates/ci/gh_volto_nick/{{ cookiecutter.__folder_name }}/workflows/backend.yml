name: Backend CI

on:
  workflow_call:
    inputs:
      base-tag:
        required: true
        type: string
      image-name-prefix:
        required: true
        type: string
      image-name-suffix:
        required: true
        type: string
      node-version:
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: backend

jobs:
  checks:
    name: "Backend: Lint and test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@{{ versions.gha_version_checkout }}

      - name: Setup Node.js
        uses: actions/setup-node@{{ versions.gha_version_setup_node }}
        with:
          node-version: {{ "${{ inputs.node-version }}" }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install backend
        working-directory: {{ "${{ inputs.working-directory }}" }}
        run: make install

      - name: Lint backend
        working-directory: {{ "${{ inputs.working-directory }}" }}
        run: make lint

      - name: Test backend
        working-directory: {{ "${{ inputs.working-directory }}" }}
        run: make test

  release:
    name: "Backend: Build and publish container image"
    uses: plone/meta/.github/workflows/container-image-build-push.yml@{{ versions.gha_version_plone_meta }}
    needs:
      - checks
    permissions:
      contents: read
      packages: write
    with:
      base-tag: {{ "${{ inputs.base-tag }}" }}
      image-name-prefix: {{ "${{ inputs.image-name-prefix }}" }}
      image-name-suffix: {{ "${{ inputs.image-name-suffix }}" }}
      working-directory: {{ "${{ inputs.working-directory }}" }}
      push: {{ "${{ github.event_name != 'pull_request' }}" }}
    secrets:
      username: {{ "${{ github.actor }}" }}
      password: {{ "${{ secrets.GITHUB_TOKEN }}" }}
