name: Changelog

on:
  pull_request:
    types: [assigned, opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

env:
  base-branch: main

permissions:
  contents: read
  pull-requests: read

jobs:
  config:
    if: {{ "${{ !contains(github.event.pull_request.labels.*.name, 'skip changelog') }}" }}
    uses: ./.github/workflows/config.yml

  checks:
    runs-on: ubuntu-latest
    needs:
      - config
    steps:
      - name: Checkout
        uses: actions/checkout@{{ versions.gha_version_checkout }}
        with:
          fetch-depth: "0"

      - name: Setup uv
        uses: plone/meta/.github/actions/setup_uv@{{ versions.gha_version_plone_meta }}
        with:
          python-version: {{ "${{ needs.config.outputs.python-version }}" }}
          working-directory: "."

      - name: Fetch base branch
        run: git fetch --no-tags origin {{ "${{ env.base-branch }}" }}

      - name: "Frontend: Check"
        id: frontend-changelog
        if: {{ "${{ always() && needs.config.outputs.changelog-frontend == 'true' }}" }}
        run: >-
          uvx towncrier check
          --compare-with origin/{{ "${{ env.base-branch }}" }}
          --config {{ "${{ needs.config.outputs.path-frontend }}" }}/towncrier.toml
          --dir {{ "${{ needs.config.outputs.path-frontend }}" }}

      - name: "Repository: Check"
        id: repository-changelog
        if: {{ "${{ always() && needs.config.outputs.changelog-repository == 'true' }}" }}
        run: >-
          uvx towncrier check
          --compare-with origin/{{ "${{ env.base-branch }}" }}
          --config {{ "${{ needs.config.outputs.path-root }}" }}/towncrier.toml
          --dir {{ "${{ needs.config.outputs.path-root }}" }}

      - name: Report check
        if: {{ "${{ always() }}" }}
        run: |
          echo '# Workflow Report' >> "$GITHUB_STEP_SUMMARY"
          echo '| Job ID | Conclusion |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| frontend | {{ "${{ steps.frontend-changelog.conclusion }}" }} |' >> "$GITHUB_STEP_SUMMARY"
          echo '| repository | {{ "${{ steps.repository-changelog.conclusion }}" }} |' >> "$GITHUB_STEP_SUMMARY"
