name: 'Cookieplone Templates: Generate codebase'
description: 'Generate the codebase for a given template'
inputs:
  python-version:
    description: 'Python Version'
    required: true
    default: '3.12'
  template:
    description: 'Template to be used'
    required: true
  frontend-use-prerelease-versions:
    description: 'Use prerelease versions (frontend templates only)'
    required: false
    default: 'No'
  frontend-volto-version:
    description: 'Volto version override as full semver (frontend templates only, e.g. 18.36.0)'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Setup
      uses: ./.github/actions/setup_python
      with:
        python-version: ${{ inputs.python-version }}

    - name: Generate codebase
      shell: bash
      run: |
        ARGS="use_prerelease_versions=${{ inputs.frontend-use-prerelease-versions }}"
        if [ -n "${{ inputs.frontend-volto-version }}" ]; then
          ARGS="$ARGS volto_version=${{ inputs.frontend-volto-version }}"
        fi
        COOKIEPLONE_REPOSITORY=$(pwd) uv run cookieplone ${{ inputs.template }} $ARGS --no-input
